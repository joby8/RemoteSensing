<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESMR Pipeline Explainer</title>
<style>

<script>
'use strict';
const CAPTURE = location.search.includes('capture');
if (CAPTURE) document.body.classList.add('capture');
const $ = id => document.getElementById(id);
const W = 1180, H = 800;
const cv = $('cv'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, f) => a + (b - a) * f;
const fmt = (x, d = 1) => x.toFixed(d).replace('-', '−');

// ---------------- data ----------------
const D = VIDEO_DATA, O = D.orbit, NL = O.nl, NP = O.np, N = NL * NP;
function dec(s, scale) {
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);

  for (let i = 0; i < a.length; i++) f[i] = a[i] === -32768 ? NaN : a[i] / scale;

}
const F = {};
[['lat',100],['lon',100],['tb',10],['theta',100],['V',10],['W',10],['L',1000],['Ts',10],['Ti',10],['ci',1000],
 ['dtb1',10],['dtb2',10],['sic_u',10],['sic1',10],['sic2',10],['c1',1000]].forEach(([k, s]) => F[k] = dec(O[k], s));
F.flags = (() => { const b = atob(O.flags), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; })();
const fl = F.flags;
const EQ1 = 1, EDGE = 2, LOW = 4, LANDB = 8, MW = 16, MI = 32, NORTH = 64;
// stage at which a pixel is removed: 1 eq1, 2 edge, 3 lat, 4 land, 0 kept
const rem = new Uint8Array(N);
for (let i = 0; i < N; i++) rem[i] = fl[i] & EQ1 ? 1 : fl[i] & EDGE ? 2 : fl[i] & LOW ? 3 : fl[i] & LANDB ? 4 : 0;
const valid = i => rem[i] === 0;
const exI = (D.example.line - 1) * NP + (D.example.pos - 1);
const LANDF = topojson.feature(LAND, LAND.objects.land);

// ---------------- colour maps ----------------
function ramp(stops) {  // stops: [[v, '#rrggbb'], ...]
  const s = stops.map(([v, c]) => [v, parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]);
  const f = v => {
    if (!(v === v)) return null;
    if (v <= s[0][0]) return s[0].slice(1);
    for (let k = 1; k < s.length; k++) if (v <= s[k][0]) {

const C = {
  tb:  ramp([[120, '#0b1d3a'], [150, '#1f4e8c'], [180, '#3f8fc4'], [210, '#9fd3e6'], [240, '#f4fbff'], [265, '#ffffff']]),
  sic: ramp([[-20, '#071530'], [0, '#12305e'], [30, '#2f74b5'], [70, '#9fd3e6'], [100, '#f7fcff'], [120, '#ffffff']]),
  div: ramp([[-15, '#1d4f91'], [-7, '#6fa3d6'], [0, '#f4f4f2'], [7, '#e58a6b'], [15, '#a8261d']]),
  divs: ramp([[-30, '#1d4f91'], [-12, '#6fa3d6'], [0, '#f4f4f2'], [12, '#e58a6b'], [30, '#a8261d']]),
  seq: ramp([[0, '#fff7e8'], [0.25, '#fdd49e'], [0.5, '#f59b4c'], [0.75, '#c8521b'], [1, '#6e2508']]),
  ang: ramp([[0, '#f2f7fb'], [32, '#7fb2db'], [64, '#16457f']]),
  ice: ramp([[0, '#12305e'], [0.15, '#12305e'], [0.5, '#5aa0cf'], [1, '#f7fcff']]),

const seqOf = (lo, hi) => v => C.seq((v - lo) / (hi - lo));
const INPUT = {
  V:  { f: 'V',  lo: 0, hi: 30, unit: 'kg/m²', name: 'water vapour V' },
  W:  { f: 'W',  lo: 0, hi: 20, unit: 'm/s', name: 'wind speed W' },
  L:  { f: 'L',  lo: 0, hi: 1, unit: 'kg/m²', name: 'cloud liquid water L' },
  Ts: { f: 'Ts', lo: 271, hi: 290, unit: 'K', name: 'sea surface temperature Ts' },
  Ti: { f: 'Ti', lo: 255, hi: 275, unit: 'K', name: 'ice temperature Ti' },
};

// ---------------- map rendering ----------------
// view: {lon, lat, scale (globe radius px), x, y, w, h}
const projCache = new Map(), layerCache = new Map();
function projFor(v) {
  return d3.geoOrthographic().rotate([-v.lon, -v.lat]).scale(v.scale).translate([v.w / 2, v.h / 2]).clipAngle(90);
}
const vkey = v => [v.lon, v.lat, v.scale, v.w, v.h].map(x => x.toFixed(3)).join(',');
function projected(v) {
  const k = vkey(v);
  if (projCache.has(k)) return projCache.get(k);
  const p = projFor(v), xy = new Float32Array(2 * N).fill(NaN);
  const r = d3.geoRotation([-v.lon, -v.lat]);
  for (let i = 0; i < N; i++) {
    const la = F.lat[i], lo = F.lon[i];
    if (!(la === la)) continue;
    const q = r([lo, la]);
    if (Math.abs(q[0]) > 89) continue;    // back side
    const s = p([lo, la]); if (s) { xy[2 * i] = s[0]; xy[2 * i + 1] = s[1]; }
  }

}
// splat pixels into an offscreen canvas; colorFn(i) -> [r,g,b] or null
function layer(v, key, colorFn) {
  const k = key + '|' + vkey(v);
  if (layerCache.has(k)) return layerCache.get(k);

  c.width = v.w; c.height = v.h;
  const g = c.getContext('2d'), im = g.createImageData(v.w, v.h), d = im.data;
  const s0 = Math.max(2, Math.ceil(v.scale * 26 / 6371 * 1.25));
  const dist = (i, j) => { const a = xy[2 * j] - xy[2 * i], b = xy[2 * j + 1] - xy[2 * i + 1]; return Math.sqrt(a * a + b * b); };
  for (let i = 0; i < N; i++) {
    const x = xy[2 * i]; if (!(x === x)) continue;
    const col = colorFn(i); if (!col) continue;
    let s = s0;
    const dl = i + NP < N ? dist(i, i + NP) : NaN, dp = (i % NP) < NP - 1 ? dist(i, i + 1) : NaN;
    if (dl === dl) s = Math.max(s, Math.ceil(dl) + 1); if (dp === dp) s = Math.max(s, Math.ceil(dp) + 1);
    s = Math.min(s, 3 * s0 + 4); const h = s >> 1;
    const x0 = Math.round(x) - h, y0 = Math.round(xy[2 * i + 1]) - h;
    for (let yy = Math.max(0, y0); yy < Math.min(v.h, y0 + s); yy++)
      for (let xx = Math.max(0, x0); xx < Math.min(v.w, x0 + s); xx++) {
        const o = 4 * (yy * v.w + xx); d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;

}
function drawBase(v, alpha = 1) {
  const p = projFor(v), path = d3.geoPath(p, ctx);
  ctx.save(); ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip(); ctx.translate(v.x, v.y); ctx.globalAlpha *= alpha;
  ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = '#dfe6ec'; ctx.fill();
  ctx.beginPath(); path(d3.geoGraticule10()); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); path(LANDF); ctx.fillStyle = '#d6d1c4'; ctx.fill(); ctx.strokeStyle = '#a9a394'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
}
function drawCoast(v, alpha = 0.9) {
  const p = projFor(v), path = d3.geoPath(p, ctx);
  ctx.save(); ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip(); ctx.translate(v.x, v.y); ctx.globalAlpha *= alpha;
  ctx.beginPath(); path(LANDF); ctx.strokeStyle = '#6f6a5e'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function drawLayer(v, key, fn, alpha = 1) {
  if (alpha <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.drawImage(layer(v, key, fn), v.x, v.y); ctx.restore();
}
function lat50(v, alpha) {
  if (alpha <= 0) return;
  const p = projFor(v), path = d3.geoPath(p, ctx);
  ctx.save(); ctx.translate(v.x, v.y); ctx.globalAlpha *= alpha; ctx.setLineDash([8, 6]);
  ctx.beginPath(); path(d3.geoCircle().center([0, 90]).radius(40)()); ctx.strokeStyle = '#b3261e'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
}
function pt(v, lon, lat) { const s = projFor(v)([lon, lat]); return s ? [s[0] + v.x, s[1] + v.y] : null; }
function panelLabel(v, text) {
  ctx.save(); ctx.font = '700 24px Helvetica Neue, Arial'; ctx.fillStyle = '#16181b'; ctx.textAlign = 'center';
  ctx.fillText(text, v.x + v.w / 2, v.y + 40); ctx.restore();
}
const VIEW = {
  globe: { lon: -10, lat: 8, scale: 330, x: 0, y: 0, w: W, h: H },
  north: { lon: -40, lat: 72, scale: 900, x: 0, y: 0, w: W, h: H },
  wide:  { lon: -40, lat: 52, scale: 520, x: 0, y: 0, w: W, h: H },
  pix:   { lon: -19.5, lat: 58, scale: 3600, x: 0, y: 0, w: W, h: H },
  L2:    { lon: -25, lat: 66, scale: 700, x: 0, y: 0, w: 590, h: H },
  R2:    { lon: -25, lat: 66, scale: 700, x: 590, y: 0, w: 590, h: H },
};
function mixView(a, b, f) {
  f = ease(f); const o = {};
  if (f <= 0) return { ...a }; if (f >= 1) return { ...b };

// colour functions
const fTB = i => C.tb(F.tb[i]);
const fTBvalid = i => valid(i) ? C.tb(F.tb[i]) : null;
const fIn = k => i => { const m = INPUT[k]; const x = F[m.f][i]; return x === x && !(fl[i] & EQ1) ? seqOf(m.lo, m.hi)(x) : null; };
const fAng = i => fl[i] & EQ1 ? null : C.ang(Math.abs(F.theta[i]));
const fSIC = k => i => valid(i) ? C.sic(F[k][i]) : null;
const fDTB = i => valid(i) && F.dtb2[i] === F.dtb2[i] ? C.div(F.dtb2[i]) : null;
const fWat = k => i => fl[i] & MW ? C.divs(F[k][i]) : null;
const fIce = k => i => valid(i) ? C.ice(k === 'ci' ? F.ci[i] : F.c1[i]) : null;

// ---------------- colour bars and charts ----------------
function colorbar(x, y, w, cmap, lo, hi, label, ticks, alpha = 1) {

  ctx.font = '19px Helvetica Neue, Arial'; ctx.textAlign = 'center';

  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  const n = Math.round((hi - lo) / bw), h = new Array(n).fill(0);

}
function axes(x, y, w, h, xlo, xhi, ylo, yhi, xt, yt, xl, yl) {
  const X = v => x + (v - xlo) / (xhi - xlo) * w, Y = v => y + h - (v - ylo) / (yhi - ylo) * h;
  ctx.save(); ctx.strokeStyle = '#d8d5cc'; ctx.lineWidth = 1; ctx.fillStyle = '#3d4248'; ctx.font = '22px Helvetica Neue, Arial';
  ctx.textAlign = 'right';
  for (const t of yt) { ctx.beginPath(); ctx.moveTo(x, Y(t)); ctx.lineTo(x + w, Y(t)); ctx.stroke(); ctx.fillText(String(t).replace('-', '−'), x - 12, Y(t) + 7); }

  for (const t of xt) ctx.fillText(String(t).replace('-', '−'), X(t), y + h + 32);
  ctx.strokeStyle = '#16181b'; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
  ctx.fillStyle = '#16181b';

  if (yl) { ctx.save(); ctx.translate(x - 66, y + h / 2); ctx.rotate(-Math.PI / 2); rich(yl, 0, 0, 24, 700, 'center'); ctx.restore(); }
  ctx.restore();

}
function bars(ax, h, lo, bw, color, f = 1, outline = false) {
  ctx.save();
  h.forEach((c, k) => {
    const x0 = ax.X(lo + k * bw), x1 = ax.X(lo + (k + 1) * bw), y = ax.Y(c * f), y0 = ax.Y(0);
    if (outline) { ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }

}
function vline(ax, v, color, label, alpha, y0, y1, dash) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 3; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(ax.X(v), y0); ctx.lineTo(ax.X(v), y1); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle = color;
  if (label) rich(label, ax.X(v), y0 - 12, 24, 700, 'center', true);

}
// canvas text with subscripts: 'T_B', 'T_{p,water}' (sans-serif, subscript at 70 %), optional white halo
function richParts(s) {
  const out = []; let last = 0; const re = /_\{([^}]*)\}|_([^\s\[\],=):]+)/g; let m;
  while ((m = re.exec(s))) { if (m.index > last) out.push([s.slice(last, m.index), 0]); out.push([m[1] ?? m[2], 1]); last = re.lastIndex; }
  if (last < s.length) out.push([s.slice(last), 0]);

}
function richWidth(s, size, weight = 400) {
  return richParts(s).reduce((w, [t, sub]) => { ctx.font = `${weight} ${sub ? Math.round(size * 0.7) : size}px Helvetica Neue, Arial`; return w + ctx.measureText(t).width; }, 0);
}
function rich(s, x, y, size, weight = 400, align = 'left', halo = false) {
  const parts = richParts(s), w = richWidth(s, size, weight);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.save(); ctx.textAlign = 'left';

    // cluster names above their peaks, tie-point labels in a separate row above the bars
    text('water cluster', ax.X(tp.water_u) - 14, ax.Y(Math.max(...hW)) - 18, 26, '#1f5fa8', 'right', 700, fade(c('hist')), true);
    text('ice cluster', ax.X(tp.ice_u) + 14, ax.Y(Math.max(...hI)) - 18, 26, '#2b86a8', 'left', 700, fade(c('hist') - 0.6), true);
    const yl = 128;
    vline(ax, tp.water_u, '#16181b', '', fade(c('tp')), yl + 30, 590, [8, 6]);
    vline(ax, tp.ice_u, '#16181b', '', fade(c('tp') - 1.2), yl + 30, 590, [8, 6]);
    ov('tpw', K(`T_{\\pw} = ${n1(tp.water_u)}\\K`), 150 + (tp.water_u - 90) / 190 * 940, yl - 26, 0, histA * fade(c('tp')), 'lab ctr');
    ov('tpi', K(`T_{\\pi} = ${n1(tp.ice_u)}\\K`), 150 + (tp.ice_u - 90) / 190 * 940, yl - 26, 0, histA * fade(c('tp') - 1.2), 'lab ctr');
    // SIC axis under the T_B axis
    const a = fade(c('eq16'));
    if (a > 0) {
      ctx.save(); ctx.globalAlpha *= a;
      const x0 = ax.X(tp.water_u), x1 = ax.X(tp.ice_u), y = 714;
      for (let k = 0; k < 200; k++) { const q = k / 199, cc = C.sic(q * 100); ctx.fillStyle = `rgb(${cc[0]|0},${cc[1]|0},${cc[2]|0})`; ctx.fillRect(x0 + q * (x1 - x0), y, (x1 - x0) / 199 + 1, 22); }
      ctx.strokeStyle = '#555'; ctx.strokeRect(x0, y, x1 - x0, 22);
      ctx.restore();
      text('SIC = 0 %', x0, y + 54, 24, '#16181b', 'center', 700, a);
      text('SIC = 100 %', x1, y + 54, 24, '#16181b', 'center', 700, a);
      text('Eq. 16: linear between the tie points', (x0 + x1) / 2, y - 18, 22, '#5d6268', 'center', 400, a);
    }
    ctx.restore();
  } else { ov('tpw', '', 0, 0, 0, 0, 'lab ctr'); ov('tpi', '', 0, 0, 0, 0, 'lab ctr'); }
  if (toMap > 0) {
    const v = VIEW.north; ctx.save(); ctx.globalAlpha = toMap; drawBase(v); ctx.restore();
    const noise = fade(c('noise'), 0.8);
    drawLayer(v, 'sicu', fSIC('sic_u'), toMap * (1 - 0.85 * noise));
    drawLayer(v, 'sicuW', i => fl[i] & MW ? C.divs(F.sic_u[i]) : null, noise);
    drawCoast(v, 0.7 * toMap);
    colorbar(60, 720, 360, C.sic, -20, 120, 'raw SIC [%]', [0, 50, 100], toMap * (1 - noise));
    colorbar(60, 720, 360, C.divs, -30, 30, 'raw SIC over the water cluster [%]', [-30, -15, 0, 15, 30], noise);
    if (c('why') > 0) { const p = pt(v, ex.lon, ex.lat); if (p) callout(p[0], p[1], p[0] + 150, p[1] - 120, ['storm: looks like ice', `raw SIC ≈ ${Math.round(ex.sic_u)} %`], fade(c('why') - 1.5), '#a8261d'); }
  }
};
S.rtm = (s, t, c) => {
  const v = mixView(VIEW.north, VIEW.pix, clamp((c('pick') + 0.2) / 2.5));
  drawBase(v);
  drawLayer(v, 'sicu', fSIC('sic_u'));
  drawCoast(v, 0.7);
  const p = pt(v, ex.lon, ex.lat);
  const dim = fade(c('inputs') - 0.3, 0.8);
  if (dim > 0) { ctx.save(); ctx.fillStyle = `rgba(246,245,241,${0.82 * dim})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  if (p) pulse(p[0], p[1], t, '#e8a33d', 12);
  // overlays
  ov('raw', `<h4>this pixel · lat ${fmt(ex.lat)}° lon ${fmt(ex.lon - 360)}° · θ = ${fmt(Math.abs(ex.theta))}°</h4><div style="font-size:30px">${K(`T_B = \\mathbf{${n1(ex.tb)}\\K}`)} &nbsp;${AR}&nbsp; raw ${K(`\\mathrm{SIC} = \\textcolor{#a8261d}{\\mathbf{${n1(ex.sic_u)}\\,\\%}}`)}</div>`,
     40, 30, 760, fade(c('raw')));
  const hlL = c('lnote') >= 0 && c('tbc') < 0;
  const row = (k, lab, u, d = 1) => `<tr class="${k === 'L' && hlL ? 'hl' : ''}"><td>${lab}</td><td>${fmt(ex[k], d)}</td><td style="opacity:${fade(c('ref'))}">${fmt(ex.ref[k], d)}</td><td style="color:#5d6268;font-size:18px">${u}</td></tr>`;
  ov('tab', `<table class="vt"><tr><th>input</th><th>pixel</th><th style="opacity:${fade(c('ref'))}">reference</th><th></th></tr>
    ${row('V', I('V'), 'kg/m²')}${row('W', I('W'), 'm/s')}${row('L', I('L'), 'kg/m²', 2)}${row('Ts', I('T_s'), 'K')}${row('Ti', I('T_i'), 'K')}
    <tr><td>${I('c', 'C')}</td><td>${fmt(ex.c, 2)}</td><td style="opacity:${fade(c('ref'))}">${fmt(ex.c, 2)}</td><td></td></tr></table>`,
     40, 150, 480, fade(c('inputs')));
  const runA = fade(c('run')), runB = fade(c('run') - 2.5);
  ov('r1', `<h4>RTM with reference weather</h4><div style="font-size:24px">${K('\\mathrm{RTM}(X_\\mathrm{ref},\\ L_\\mathrm{ref},\\ c,\\ \\theta)')}</div><div class="big" style="color:#2e8b48">${fmt(ex.rtm_ref)} K</div>`, 580, 150, 540, runA);
  ov('r2', `<h4>RTM with this pixel's weather</h4><div style="font-size:24px">${K(`\\mathrm{RTM}(V,\\ W,\\ T_s,\\ T_i,\\ ${hlL ? '\\colorbox{#fff3c4}{$L_\\mathrm{ref}$}' : 'L_\\mathrm{ref}'},\\ c,\\ \\theta)`)}</div><div class="big" style="color:#2e8b48">${fmt(ex.rtm_pix)} K</div>`, 580, 320, 540, runB);
  ov('d', `<h4>correction · Eq. 14</h4><div style="font-size:34px">${K(`\\Delta T_B = ${n1(ex.rtm_ref)} - ${n1(ex.rtm_pix)} = \\textcolor{#1d4f91}{\\mathbf{${n1(ex.dtb)}\\K}}`)}</div>`, 580, 490, 560, fade(c('dtb')));
  ov('l', `<div style="font-size:21px"><b>L is not corrected:</b> both runs use ${K(`L_\\mathrm{ref} = ${fmt(ex.ref.L, 2)}`)} kg/m² (pixel: ${fmt(ex.L, 2)})</div>`, 40, 470, 480, fade(c('lnote')) * (1 - fade(c('tbc') - 0.2)));
  const sic2 = Math.abs(ex.sic2) < 0.05 ? 0 : ex.sic2;
  ov('c', `<h4>Eq. 13 and Eq. 16 with corrected tie points</h4><div style="font-size:30px">${K(`T_{B,c} = ${n1(ex.tb)} ${n1(ex.dtb).replace('-', '- ')} = \\mathbf{${n1(ex.tb + ex.dtb)}\\K}`)}<span style="opacity:${fade(c('sicc'))}"> &nbsp;${AR}&nbsp; ${K(`\\mathrm{SIC}_c = \\textcolor{#2e8b48}{\\mathbf{${n1(sic2)}\\,\\%}}`)}</span></div>`, 40, 660, 1100, fade(c('tbc')));
};
S.orbitcorr = (s, t, c) => {
  const split = fade(c('compare') - 0.2, 1.2);
  const v = mixView(VIEW.north, VIEW.L2, split), v2 = { ...VIEW.R2, x: Math.round(lerp(1180, 590, ease(split))) };
  drawBase(v);
  drawLayer(v, 'dtb', fDTB, 1 - split);
  drawLayer(v, 'wU', fWat('sic_u'), split);
  drawCoast(v, 0.6);
  if (split > 0) { drawBase(v2); drawLayer(v2, 'w2', fWat('sic2')); drawCoast(v2, 0.6);
    ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(588, 0, 4, H); ctx.restore();
    ctx.save(); ctx.globalAlpha = fade(c('compare') - 1); panelLabel(v, `raw: std ${fmt(sd.w_u)} %`); panelLabel(v2, `corrected: std ${fmt(sd.w_2)} %`); ctx.restore(); }
  colorbar(60, 720, 360, C.div, -15, 15, 'RTM correction ΔT_B [K]', [-15, -10, -5, 0, 5, 10, 15], 1 - split);
  colorbar(60, 720, 360, C.divs, -30, 30, 'SIC over the water cluster [%]', [-30, -15, 0, 15, 30], split);
  if (c('storm') > 0 && split === 0) { const p = pt(v, ex.lon, ex.lat); if (p) callout(p[0], p[1], p[0] + 150, p[1] + 110, ['our example pixel', `ΔT_B = ${fmt(ex.dtb)} K`], fade(c('storm') - 0.5)); }
};
S.iterate = (s, t, c) => {
  // maps stay until 'std'; then they fade out completely before the chart fades in (no cross-fade)
  const p = c('std'), mapA = 1 - fade(p, 0.5), chartA = fade(p - 0.5, 0.5);
  if (mapA > 0) {
    ctx.save(); ctx.globalAlpha = mapA;
    const sp = fade(c('c1'), 1.2);
    const v = mixView(VIEW.north, VIEW.L2, sp), v2 = { ...VIEW.R2, x: Math.round(lerp(1180, 590, ease(sp))) };
    drawBase(v); drawLayer(v, 'ci', fIce('ci'), fade(c('c0'))); drawLayer(v, 'sicu', fSIC('sic_u'), 1 - fade(c('c0'))); drawCoast(v, 0.6);
    if (sp > 0) {
      drawBase(v2); drawLayer(v2, 'c1', fIce('c1')); drawCoast(v2, 0.6); ctx.fillStyle = '#fff'; ctx.fillRect(588, 0, 4, H);
      ctx.save(); ctx.globalAlpha *= fade(c('c1') - 1);
      panelLabel(v, 'iteration 1: c = ERA5 siconc'); panelLabel(v2, 'iteration 2: c = our SIC'); ctx.restore();
    }
    colorbar(60, 720, 360, C.ice, 0, 1, 'ice fraction c used in the RTM', [0, 0.15, 0.5, 1], fade(c('c0')));
    ctx.restore();
  }
  if (chartA > 0) {
    ctx.save(); ctx.globalAlpha = chartA;
    const ax = axes(220, 150, 760, 460, 0, 3, 0, 12.5, [], [0, 2, 4, 6, 8, 10, 12], '', 'std of SIC over water [%]');
    const vals = [[sd.w_u, 'raw'], [sd.w_1, 'iteration 1'], [sd.w_2, 'iteration 2']];
    vals.forEach(([v, l], k) => {
      const g = fade(p - 1.0 - 1.6 * k, 0.8);
      const x0 = ax.X(k + 0.2), x1 = ax.X(k + 0.8), y = ax.Y(v * g);
      ctx.fillStyle = k ? '#2e8b48' : '#8d9298'; ctx.fillRect(x0, y, x1 - x0, ax.Y(0) - y);
      text(l, (x0 + x1) / 2, ax.Y(0) + 36, 24, '#16181b', 'center', 700);
      text(`${fmt(v * g)} %`, (x0 + x1) / 2, y - 14, 30, '#16181b', 'center', 700, g);
    });
    text('5 Feb 1973, north, water cluster', 600, 100, 24, '#5d6268', 'center', 700);
    text('iteration 3: < 0.4 % change → stop after 2', 600, 740, 26, '#2e8b48', 'center', 700, fade(c('stop')));
    ctx.restore();
  }
};
const hu = D.day.hist_u, h2 = D.day.hist_2, he = D.day.hist_edges;
S.result = (s, t, c) => {
  const histA = 1 - fade(c('month'), 0.5), toMonth = fade(c('month') - 0.5, 0.5);
  if (histA > 0) {
    ctx.save(); ctx.globalAlpha = histA;
    const ax = axes(130, 110, 960, 500, -40, 60, 0, Math.max(...hu, ...h2) * 1.08, [-40, -20, 0, 20, 40, 60], [], 'SIC over the water cluster [%]  (5 Feb, north, all orbits)', 'pixels');
    bars(ax, hu, -40, 2, 'rgba(141,146,152,0.55)', fade(c('histo')));
    bars(ax, h2, -40, 2, '#2e8b48', fade(c('histo') - 1.5), true);
    vline(ax, 0, '#16181b', 'mean = 0', fade(c('narrow')), 150, 610, [6, 6]);
    text('raw', ax.X(-25), 300, 26, '#6b6f75', 'center', 700, fade(c('histo')));
    text('corrected', ax.X(-25), 340, 26, '#2e8b48', 'center', 700, fade(c('histo') - 1.5));
    text(`std ${fmt(sd.w_u)} % → ${fmt(sd.w_2)} %`, ax.X(35), 300, 30, '#16181b', 'center', 700, fade(c('narrow') - 1));
    ctx.restore();
  }
  if (toMonth > 0) {
    ctx.save(); ctx.globalAlpha = toMonth;
    ['N', 'S'].forEach((h, r) => {
      const rows = D.month.filter(m => m.hemi === h && m.day !== '0228');
      const y0 = 70 + r * 360, ax = axes(130, y0, 980, 250, 0, rows.length, 0, h === 'N' ? 16 : 22, [], h === 'N' ? [0, 5, 10, 15] : [0, 10, 20], '', 'std SIC [%]');
      text(h === 'N' ? 'North · water cluster' : 'South · water cluster', 140, y0 - 14, 22, '#16181b', 'left', 700);
      const g = fade(c('month') - 1.1 - r * 1.5, 1.5);
      rows.forEach((m, k) => {
        const x = ax.X(k + 0.15), w = ax.X(k + 0.85) - x;
        ctx.fillStyle = 'rgba(141,146,152,0.6)'; ctx.fillRect(x, ax.Y(m.w_u), w, ax.Y(0) - ax.Y(m.w_u));
        const yc = ax.Y(lerp(m.w_u, m.w_c, g)); ctx.fillStyle = '#2e8b48'; ctx.fillRect(x + w * 0.2, yc, w * 0.6, ax.Y(0) - yc);
        if (k % 3 === 0) text(String(+m.day.slice(2)), x + w / 2, ax.Y(0) + 26, 16, '#5d6268', 'center');
      });
    });
    text('grey = raw · green = corrected · day of February', 590, 770, 20, '#5d6268', 'center', 700);
    ctx.restore();
  }
};
const SW = D.sweep, COL = { V: '#2f6db5', W: '#e07b1f', L: '#3f9b4a', Ts: '#8a4fb0', Ti: '#c0392b' };
S.sens = (s, t, c) => {
  let th = c('sweep') < 0 ? 0 : 64 * clamp(c('sweep') / 4.5);
  if (c('water') >= 0) th = lerp(64, 50, ease(c('water') / 1.2));
  if (c('angle') >= 0) th = c('angle') < 1 ? lerp(50, 0, ease(c('angle'))) : 55.7 * clamp((c('angle') - 1) / 4);
  if (c('iceside') >= 0) th = lerp(55.7, 50, ease(c('iceside')));
  const panels = [['water', ['V', 'W', 'L', 'Ts'], 70, 'Water (c = 0)'], ['ice', ['V', 'L', 'Ti'], 440, 'Ice (c = 1)']];
  const hiK = { water: { water: 1, cloud: 1 }, ice: { iceside: 1 } };
  panels.forEach(([surf, ins, y0, lab]) => {
    const ax = axes(130, y0, 700, 270, 0, 64, -1, surf === 'water' ? 16 : 5, [0, 10, 20, 30, 40, 50, 60], surf === 'water' ? [0, 4, 8, 12, 16] : [0, 2, 4], y0 > 300 ? 'incidence angle θ [°]' : '', 'ΔT_B per +1σ [K]');
    ctx.save(); ctx.fillStyle = 'rgba(160,160,160,0.18)'; ctx.fillRect(ax.X(55.67), y0, ax.X(64) - ax.X(55.67), 270); ctx.restore();
    text(lab, 140, y0 - 12, 22, '#16181b', 'left', 700);
    ins.forEach(k => {
      const y = SW[surf][k], dim = (c('water') >= 0 && c('angle') < 0 && surf === 'water' && k !== 'V' && k !== 'W' && !(k === 'L' && c('cloud') >= 0)) ? 0.25 : 1;
      ctx.save(); ctx.globalAlpha = (c('iceside') >= 0 && surf === 'water') ? 0.35 : dim;
      ctx.strokeStyle = COL[k]; ctx.lineWidth = 4; if (k === 'L') ctx.setLineDash([12, 8]);
      ctx.beginPath(); SW.theta.forEach((a, j) => { if (a > th) return; const X = ax.X(a), Y = ax.Y(y[j]); j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();
      ctx.restore();
    });
    // cursor + bars at current theta
    const j = Math.min(64, Math.round(th)); th = Math.round(th * 10) / 10;
    ctx.save(); ctx.strokeStyle = '#16181b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ax.X(th), y0); ctx.lineTo(ax.X(th), y0 + 270); ctx.stroke(); ctx.restore();
    ins.forEach((k, n) => {
      const val = SW[surf][k][j], bx = 880, by = y0 + 20 + n * 60, sc = surf === 'water' ? 12 : 30;
      ctx.save(); ctx.globalAlpha = (c('iceside') >= 0 && surf === 'water') ? 0.35 : 1;
      ctx.fillStyle = COL[k]; ctx.fillRect(bx + 40, by, Math.max(2, val * sc), 34);
      text(k === 'L' ? 'L*' : k, bx, by + 26, 24, COL[k], 'left', 700);
      text(`${fmt(val)} K`, bx + 48 + Math.max(2, val * sc), by + 26, 21, '#16181b', 'left', 700);
      ctx.restore();
    });
    text(`θ = ${th.toFixed(0)}°`, 880, y0 + 260, 22, '#5d6268', 'left', 700);
  });
  text('* L not corrected · grey band = removed swath edge (θ > 55.7°)', 590, 785, 18, '#5d6268', 'center');
};
S.outro = (s, t, c) => {
  const v = VIEW.L2, v2 = { ...VIEW.R2 };
  drawBase(v); drawLayer(v, 'wU', fWat('sic_u')); drawCoast(v, 0.6);
  drawBase(v2); drawLayer(v2, 'w2', fWat('sic2')); drawCoast(v2, 0.6);
  ctx.fillStyle = '#fff'; ctx.fillRect(588, 0, 4, H);
  panelLabel(v, `raw: std ${fmt(sd.w_u)} %`); panelLabel(v2, `corrected: std ${fmt(sd.w_2)} %`);
  colorbar(60, 720, 360, C.divs, -30, 30, 'SIC over the water cluster [%]', [-30, -15, 0, 15, 30], 1);
};

// ---------------- render ----------------
function renderAt(t) {
  const s = sceneAt(t);
  if (s.id !== lastScene) setupScene(s);
  const c = name => cueT(s, t, name);
  // pipeline highlight
  const cur = stepOf[s.id];
  STEPS.forEach((_, k) => {
    const e = $('ps' + k);
    let cls = 'ps' + (k < cur ? ' done' : k === cur ? ' now' : '');
    if (s.id === 'intro' && c('flow') >= 0) cls = 'ps' + (k <= Math.floor(c('flow') / 0.7) ? ' now' : '');
    if (s.id === 'outro') cls = 'ps done';
    if (e.className !== cls) e.className = cls;
  });
  // cards
  let bottom = 0;
  cardEls.forEach(({ cue, d, y }) => { const a = fade(c(cue), 0.5); if (a > 0) bottom = Math.max(bottom, y + d.offsetHeight * a); });
  const shift = Math.max(0, bottom - 440);
  cardEls.forEach(({ cue, d }) => { const a = fade(c(cue), 0.5); d.style.opacity = a; d.style.transform = `translate(${(1 - a) * 30}px, ${-shift}px)`; });
  // subtitle
  const l = s.lines.find(l => t >= l.start - 0.05 && t < l.start + l.dur + 0.35);
  const st = l ? l.text : '';
  if ($('sub').textContent !== st) $('sub').textContent = st;
  // fade between scenes
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  S[s.id](s, t, c);
  const fin = clamp((t - (s.start - 0.4)) / 0.5), next = TL.scenes[TL.scenes.indexOf(s) + 1];
  const fout = next ? clamp((next.start - 0.4 - t) / 0.4) : 1;
  const a = Math.min(fin, fout);
  if (a < 1) { ctx.fillStyle = `rgba(255,255,255,${1 - a})`; ctx.fillRect(0, 0, W, H); }
  $('head').style.opacity = Math.min(1, fin * 1.5);
  $('ov').style.opacity = a;
}
window.renderAt = renderAt;

// ---------------- preview controls ----------------
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `scale(${s})`; }
if (!CAPTURE) {
  addEventListener('resize', fit); fit();
  const aud = $('aud'), seek = $('seek'); seek.max = TL.duration;
  let playing = false;
  $('play').onclick = () => { playing = !playing; playing ? aud.play() : aud.pause(); $('play').textContent = playing ? '❚❚' : '▶'; };
  seek.oninput = () => { aud.currentTime = +seek.value; renderAt(+seek.value); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); } });
  (function loop() { if (playing) { seek.value = aud.currentTime; renderAt(aud.currentTime); } $('tt').textContent = (+seek.value).toFixed(1) + ' s'; requestAnimationFrame(loop); })();
}
// load the KaTeX fonts before the first frame: render every card once off-screen
const pre = document.createElement('div'); pre.style.cssText = 'position:absolute;left:-9999px;top:0;width:540px';
pre.innerHTML = Object.values(CARDS).flat().map(x => x[3] + x[2]).join('') + K('\\mathbf{1}\\textcolor{red}{x}');
document.body.appendChild(pre);
document.fonts.ready.then(() => { pre.remove(); lastScene = null; renderAt(0); window.READY = true; });
</script>
